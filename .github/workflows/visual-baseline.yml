# =====================================================================
# visual-baseline.yml — Regenerate the visual regression baseline IN CI
# =====================================================================
# PR #9 hardening. Why this workflow exists:
#   Pixel baselines are only meaningful when generated in the SAME
#   environment that later compares them (same Chromium build, same
#   fonts, same rendering). This workflow regenerates the baselines on
#   a GitHub runner and COMMITS them to the triggering branch, so the
#   CI comparison (ci.yml → "Run visual regression tests") is always
#   environment-exact.
#
# Usage:
#   1. A visual change is intentional → run this workflow on your branch
#      (Actions → Visual Baseline → Run workflow → select the branch).
#   2. It commits the new baseline PNGs with a clear message.
#   3. The next CI run compares against the updated baseline.
#
# If you did NOT change visuals and this is needed, something drifted —
# investigate instead of blindly regenerating.
# =====================================================================
name: Visual Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-baseline:
    name: Regenerate visual baseline (commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browser
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Reset DB (deterministic state for baselines)
        working-directory: backend
        run: |
          rm -f ../data/samba.db ../data/samba.db-wal ../data/samba.db-shm
          node scripts/run-migrations.js

      - name: Regenerate baselines (--update-snapshots)
        working-directory: backend
        run: npx playwright test --project=visual --update-snapshots

      - name: Commit updated baselines
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/e2e/visual-regression.spec.js-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes — nothing to commit."
          else
            git commit -m "test(visual): update baseline PNGs (regenerated in CI env)"
            git push origin HEAD:${{ github.ref_name }}
            echo "Baselines committed to ${{ github.ref_name }}."
          fi
