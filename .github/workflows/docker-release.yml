# =====================================================================
# docker-release.yml — Build and push Docker image to GHCR on tag push
# =====================================================================
# Triggers on tag pushes matching v* (e.g., v0.6.1, v1.0.0).
# Builds multi-arch image (amd64 + arm64) and pushes to GHCR:
#   ghcr.io/lean031110/sambapos-lba:<version>
#   ghcr.io/lean031110/sambapos-lba:latest (only on stable tags)
#
# Also produces:
#   - SBOM via syft (if available)
#   - Image digest
#   - Smoke-test report
# =====================================================================

name: Docker Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build + Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # Get version from tag (strip leading 'v')
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
            # workflow_dispatch — use sha
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Lowercase repo name for GHCR
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JWT_SECRET=ci-build-placeholder-not-used-in-runtime
            ADMIN_PIN=ci-build-placeholder

      - name: Smoke-test the pushed image
        run: |
          set -e
          IMAGE="ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.meta.outputs.version }}"
          echo "Smoke-testing $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name samba-smoke \
            -p 3001:3001 \
            -e JWT_SECRET=ci-test-secret-do-not-use-in-production-32chars \
            -e ADMIN_PIN=1234 \
            -e NODE_ENV=production \
            -e CORS_ORIGIN=https://pos.example.com \
            "$IMAGE"
          # Wait for /ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ready > /dev/null; then
              echo "Container ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3001/ready | tee /tmp/smoke-ready.json
          echo "=== /health ==="
          curl -sf http://localhost:3001/health
          echo ""
          echo "=== Smoke test PASSED ==="
          docker stop samba-smoke && docker rm samba-smoke

      - name: Generate SBOM (if syft available)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json
        continue-on-error: true  # SBOM is best-effort

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Output digest
        run: |
          docker pull ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.meta.outputs.version }} >/dev/null
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.meta.outputs.version }} | sed 's/.*@//')
          echo "Image digest: $DIGEST"
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
