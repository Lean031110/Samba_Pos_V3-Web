# =====================================================================
# SambaPos_LBA — CI/CD Pipeline
# =====================================================================
# Runs on every push to main and on every PR.
#
# Repository layout (post-reorganization):
#   /                  ← repo root (no samba-web-clone/ wrapper)
#   ├── backend/
#   ├── frontend/
#   ├── docs/
#   ├── analysis/
#   ├── data/           ← SQLite DB (gitignored)
#   ├── .github/
#   ├── Dockerfile
#   └── docker-compose.yml
#
# Pipeline stages:
#   0. security   — gitleaks secret scan + npm audit (0 vulnerabilities)
#   1. install    — npm ci (cached)
#   2. lint       — syntax + style check
#   3. migrations — run via programmatic script (knex CLI breaks on env-based config)
#   4. unit tests — integration + KDS + inventory + concurrency + security
#   5. e2e tests  — Playwright (failOnFlakyTests=true, --repeat-each=2)
#   6. docker build — multi-stage image sanity check
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security (gitleaks + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scan

      - name: Gitleaks — scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Node.js for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (must be 0 vulnerabilities)
        working-directory: backend
        run: |
          set -e
          npm ci --ignore-scripts
          # Run audit. With --audit-level=low, npm exits non-zero if any
          # vulnerability at or above 'low' severity is found.
          npm audit --audit-level=low
          # Belt-and-suspenders: parse the JSON report and fail if any
          # vulnerabilities are present (npm audit --json prints them with
          # a space after the colon, so we parse instead of grep).
          npm audit --json > /tmp/audit.json
          VULN_TOTAL=$(node -e "const r=require('/tmp/audit.json'); console.log((r.metadata&&r.metadata.vulnerabilities&&r.metadata.vulnerabilities.total)||0)")
          echo "Total vulnerabilities: $VULN_TOTAL"
          if [ "$VULN_TOTAL" -ne "0" ]; then
            echo "FAIL: $VULN_TOTAL vulnerabilities found"
            npm audit
            exit 1
          fi
          echo "OK: 0 vulnerabilities"

  test:
    name: Tests (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: security  # fail fast on security issues

    env:
      JWT_SECRET: ci-test-secret-do-not-use-in-production-32chars
      ADMIN_PIN: '1234'
      NODE_ENV: test
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint (node --check on every .js file)
        working-directory: backend
        run: |
          set -e
          # syntax-check every .js file under src/ and tests/
          find src tests scripts -name '*.js' -type f -print0 \
            | xargs -0 -n1 node --check

      - name: Run migrations + seed (programmatic)
        working-directory: backend
        run: node scripts/run-migrations.js

      - name: Integration tests (47)
        working-directory: backend
        run: node --test tests/api-integration.test.js

      - name: KDS verification tests (49)
        working-directory: backend
        run: |
          node scripts/run-migrations.js
          node --test tests/kds-verification.test.js

      - name: Inventory verification tests (13)
        working-directory: backend
        run: |
          node scripts/run-migrations.js
          node --test tests/inventory-verification.test.js

      - name: Concurrency tests (8)
        working-directory: backend
        run: |
          node scripts/run-migrations.js
          node --test tests/concurrency-verification.test.js

      - name: Idempotency verification tests (7)
        working-directory: backend
        run: |
          node scripts/run-migrations.js
          node --test tests/idempotency-verification.test.js

      - name: Domain verification tests (72)
        working-directory: backend
        run: |
          node scripts/run-migrations.js
          node --test tests/domain-verification.test.js

      - name: Printing verification tests (24)
        working-directory: backend
        run: |
          node scripts/run-migrations.js
          node --test tests/printing-verification.test.js

      - name: Recipes verification tests (25)
        working-directory: backend
        run: |
          node scripts/run-migrations.js
          node --test tests/recipes-verification.test.js

      # -----------------------------------------------------------------
      # Playwright E2E
      # -----------------------------------------------------------------
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Reset DB for E2E
        working-directory: backend
        run: |
          rm -f ../data/samba.db ../data/samba.db-wal ../data/samba.db-shm
          node scripts/run-migrations.js

      - name: Run E2E tests (27, failOnFlakyTests=true, repeat-each=2)
        working-directory: backend
        run: npx playwright test --reporter=line --repeat-each=2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/tests/e2e/report
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: backend/test-results
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sambapos-lba:ci .
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production-32chars
          ADMIN_PIN: '1234'

      - name: Verify image was created
        run: docker images sambapos-lba:ci

      - name: Smoke-test container (start + /health + stop)
        run: |
          set -e
          docker run -d --name samba-ci \
            -p 3001:3001 \
            -e JWT_SECRET=ci-test-secret-do-not-use-in-production-32chars \
            -e ADMIN_PIN=1234 \
            -e NODE_ENV=production \
            sambapos-lba:ci
          # Wait for /health to return 200
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "Container healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3001/health | tee /tmp/health.json
          docker stop samba-ci && docker rm samba-ci
