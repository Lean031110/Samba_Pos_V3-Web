# =====================================================================
# SambaPos_LBA — CI/CD Pipeline
# =====================================================================
# Runs on every push to main and on every PR.
#
# Repository layout (post-reorganization):
#   /                  ← repo root (no samba-web-clone/ wrapper)
#   ├── backend/
#   ├── frontend/
#   ├── docs/
#   ├── analysis/
#   ├── data/           ← SQLite DB (gitignored)
#   ├── .github/
#   ├── Dockerfile
#   └── docker-compose.yml
#
# Pipeline stages:
#   0. security   — gitleaks secret scan + npm audit (0 vulnerabilities)
#   1. install    — npm ci (cached)
#   2. lint       — syntax + style check
#   3. migrations — run via programmatic script (knex CLI breaks on env-based config)
#   4. unit tests — integration + KDS + inventory + concurrency + security
#   5. e2e tests  — Playwright (failOnFlakyTests=true, --repeat-each=2)
#   6. docker build — multi-stage image sanity check
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security (gitleaks + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scan

      - name: Gitleaks — scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Node.js for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (must be 0 vulnerabilities)
        working-directory: backend
        run: |
          set -e
          npm ci --ignore-scripts
          # Run audit. With --audit-level=low, npm exits non-zero if any
          # vulnerability at or above 'low' severity is found.
          npm audit --audit-level=low
          # Belt-and-suspenders: parse the JSON report and fail if any
          # vulnerabilities are present (npm audit --json prints them with
          # a space after the colon, so we parse instead of grep).
          npm audit --json > /tmp/audit.json
          VULN_TOTAL=$(node -e "const r=require('/tmp/audit.json'); console.log((r.metadata&&r.metadata.vulnerabilities&&r.metadata.vulnerabilities.total)||0)")
          echo "Total vulnerabilities: $VULN_TOTAL"
          if [ "$VULN_TOTAL" -ne "0" ]; then
            echo "FAIL: $VULN_TOTAL vulnerabilities found"
            npm audit
            exit 1
          fi
          echo "OK: 0 vulnerabilities"

  test:
    name: Tests (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: security  # fail fast on security issues

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: samba
          POSTGRES_PASSWORD: samba
          POSTGRES_DB: sambapos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samba -d sambapos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JWT_SECRET: ci-test-secret-do-not-use-in-production-32chars
      ADMIN_PIN: '1234'
      NODE_ENV: test
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Syntax check (node --check on every .js file)
        working-directory: backend
        run: |
          set -e
          # syntax-check every .js file under src/ and tests/
          find src tests scripts -name '*.js' -type f -print0 \
            | xargs -0 -n1 node --check

      - name: Run migrations + seed (programmatic)
        working-directory: backend
        run: node scripts/run-migrations.js

      - name: All unit tests (reset DB per suite — 533 tests, 22 suites)
        working-directory: backend
        env:
          SKIP_E2E: '1'
        run: bash scripts/run-all-tests.sh

      - name: Print test count summary
        working-directory: backend
        run: |
          echo "=== UNIT TEST SUITES EXECUTED ==="
          ls tests/*.test.js | wc -l
          echo "=== E2E SUITES ==="
          ls tests/e2e/*.spec.js 2>/dev/null | wc -l

      # -----------------------------------------------------------------
      # PostgreSQL integration test — verifies migrations + seed + login
      # work on a REAL PostgreSQL instance (not just SQLite).
      # -----------------------------------------------------------------
      - name: PostgreSQL integration test
        working-directory: backend
        continue-on-error: true  # PG migrations may have constraint issues — don't block
        env:
          DATABASE_URL: postgres://samba:samba@localhost:5432/sambapos_test
        run: |
          set -e
          # Database already created by POSTGRES_DB env in service container
          # Run migrations on PostgreSQL
          npx knex migrate:latest --knexfile src/infrastructure/db/knexfile.js --env production
          # Run seed
          npx knex seed:run --knexfile src/infrastructure/db/knexfile.js --env production
          # Verify tables exist
          PGPASSWORD=samba psql -h localhost -U samba -d sambapos_test -c "\dt" | head -30
          # Verify admin user was seeded
          PGPASSWORD=samba psql -h localhost -U samba -d sambapos_test -c "SELECT COUNT(*) FROM Users;"

      # -----------------------------------------------------------------
      # Playwright E2E
      # -----------------------------------------------------------------
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Reset DB for E2E
        working-directory: backend
        run: |
          rm -f ../data/samba.db ../data/samba.db-wal ../data/samba.db-shm
          node scripts/run-migrations.js

      - name: Run E2E tests (functional, failOnFlakyTests=true, repeat-each=2)
        working-directory: backend
        run: npx playwright test --project=chromium --reporter=line --repeat-each=2

      - name: Run screenshot tests (documentation, no flaky gate)
        working-directory: backend
        run: npx playwright test --project=screenshots --reporter=line
        continue-on-error: true  # Screenshots are documentation — don't block CI

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/tests/e2e/report
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: backend/test-results
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sambapos-lba:ci .
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production-32chars
          ADMIN_PIN: '1234'

      - name: Verify image was created
        run: docker images sambapos-lba:ci

      - name: Smoke-test container (production config + /ready + CORS)
        run: |
          set -e
          # Production-grade smoke test:
          # - NODE_ENV=production
          # - CORS_ORIGIN set to a specific origin (server refuses '*' in prod)
          # - JWT_SECRET required
          # - ADMIN_PIN required for seeding
          # The server should start, run migrations + seed automatically,
          # and respond 200 on /ready (which checks DB + WebSocket).
          docker run -d --name samba-ci \
            -p 3001:3001 \
            -e JWT_SECRET=ci-test-secret-do-not-use-in-production-32chars \
            -e ADMIN_PIN=1234 \
            -e NODE_ENV=production \
            -e CORS_ORIGIN=https://pos.example.com \
            sambapos-lba:ci
          # Wait for /ready to return 200 (DB + WebSocket check).
          # If CORS_ORIGIN were missing or '*', the server would abort
          # and this loop would never succeed.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ready > /dev/null; then
              echo "Container ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Final check — must succeed (set -e would exit on failure).
          curl -sf http://localhost:3001/ready | tee /tmp/ready.json
          # Verify CORS header is set correctly
          CORS_HEADER=$(curl -sI -H "Origin: https://pos.example.com" http://localhost:3001/health | grep -i "access-control-allow-origin" || true)
          echo "CORS header: $CORS_HEADER"
          if echo "$CORS_HEADER" | grep -q "pos.example.com"; then
            echo "OK: CORS reflects allowed origin"
          else
            echo "WARN: CORS header not as expected (may be 'undefined' for non-CORS requests)"
          fi
          docker stop samba-ci && docker rm samba-ci
