# =====================================================================
# android.yml — Build Android APK/AAB via Capacitor
# =====================================================================
# Triggers:
#   - push to feature/android-ci-build
#   - PR to main
#   - manual dispatch
#
# Produces:
#   - SambaPos-LBA-debug.apk (always)
#   - SambaPos-LBA-release.aab (only when signing secrets exist)
# =====================================================================
name: Android Build

on:
  push:
    branches: ['feature/android-ci-build']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Capacitor
        working-directory: backend
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D @capacitor/splash-screen

      - name: Copy web assets
        working-directory: backend
        run: npx cap copy android

      - name: Add Android platform (if not exists)
        working-directory: backend
        run: npx cap add android || true

      - name: Sync Android project
        working-directory: backend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk
          # Verify package ID
          AAPT=$(find $ANDROID_HOME -name aapt2 -type f | head -1)
          if [ -n "$AAPT" ]; then
            $AAPT dump packagename android/app/build/outputs/apk/debug/app-debug.apk || true
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SambaPos-LBA-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release AAB — only when signing secrets exist
      - name: Build release AAB (if signing configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # Decode keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          # Configure signing in gradle properties
          cat >> gradle.properties << EOF
          android.injected.signing.store.file=release.keystore
          android.injected.signing.store.password=$ANDROID_STORE_PASSWORD
          android.injected.signing.key.alias=$ANDROID_KEY_ALIAS
          android.injected.signing.key.password=$ANDROID_KEY_PASSWORD
          EOF
          ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SambaPos-LBA-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
