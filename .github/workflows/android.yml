# =====================================================================
# android.yml — Build Android APK via Capacitor
# =====================================================================
name: Android Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor (root)
        run: npm install

      - name: Verify Capacitor config
        run: |
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json
          echo "=== frontend exists? ==="
          ls -la frontend/index.html | head -3

      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy web assets
        run: npx cap copy android

      - name: Inject LBApos splash + branding (BLOQUE N)
        run: |
          # Splash del APK: logo LBA (PNG) por densidad.
          # El fondo azul #044392 lo aporta el plugin SplashScreen
          # (backgroundColor en capacitor.config.json) — sin XML duplicado.
          RES=android/app/src/main/res
          mkdir -p $RES/drawable $RES/drawable-hdpi $RES/drawable-xhdpi $RES/drawable-xxhdpi $RES/drawable-xxxhdpi
          for density in hdpi xhdpi xxhdpi xxxhdpi; do
            cp frontend/assets/splash-512.png $RES/drawable-$density/splash.png
          done
          cp frontend/assets/splash-512.png $RES/drawable/splash.png
          # appName debe ser LBApos (verificación dura)
          STRINGS=$RES/values/strings.xml
          echo "=== strings.xml ==="; cat $STRINGS
          grep -q 'app_name">LBApos' $STRINGS || (sed -i 's|name="app_name">[^<]*<|name="app_name">LBApos<|' $STRINGS; echo "[branding] app_name forzado a LBApos")
          grep -q 'app_name">LBApos' $STRINGS || { echo "FAIL: app_name no es LBApos"; exit 1; }
          # Portrait (POS/KDS son verticales por diseño)
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation' $MANIFEST || sed -i 's|android:exported="true"|android:screenOrientation="portrait"\n            android:exported="true"|' $MANIFEST

      - name: Sync Android project
        run: npx cap sync android

      - name: List Android project structure
        run: |
          echo "=== android/ exists? ==="
          ls -la android/ | head -10
          echo "=== app/build.gradle exists? ==="
          ls -la android/app/build.gradle 2>/dev/null || echo "NOT FOUND"
          echo "=== splash resources ==="
          find android/app/src/main/res -name 'splash*' -type f | head -10

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LBApos-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release AAB — only when signing secrets exist
      - name: Build release AAB (if signing configured)
        if: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ vars.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat >> gradle.properties << EOF
          android.injected.signing.store.file=release.keystore
          android.injected.signing.store.password=$ANDROID_STORE_PASSWORD
          android.injected.signing.key.alias=$ANDROID_KEY_ALIAS
          android.injected.signing.key.password=$ANDROID_KEY_PASSWORD
          EOF
          ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SambaPos-LBA-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
