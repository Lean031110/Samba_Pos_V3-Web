# =====================================================================
# android.yml — Build Android APK/AAB via Capacitor
# =====================================================================
name: Android Build

on:
  push:
    branches: ['main', 'feature/android-ci-build']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install root dependencies (Capacitor)
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Capacitor in backend
        working-directory: backend
        run: |
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6
          npm install -D @capacitor/splash-screen@^6

      - name: Copy web assets to Android
        run: npx cap copy android || true

      - name: Add Android platform (if not exists)
        run: npx cap add android || true

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SambaPos-LBA-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release AAB — only when signing secrets exist
      - name: Build release AAB (if signing configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat >> gradle.properties << EOF
          android.injected.signing.store.file=release.keystore
          android.injected.signing.store.password=$ANDROID_STORE_PASSWORD
          android.injected.signing.key.alias=$ANDROID_KEY_ALIAS
          android.injected.signing.key.password=$ANDROID_KEY_PASSWORD
          EOF
          ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SambaPos-LBA-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
