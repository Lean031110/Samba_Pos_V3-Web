# =====================================================================
# SambaPOS V3 Web Clone — CI/CD Pipeline
# =====================================================================
# Runs on every push to main and on every PR.
# Steps: install → lint → unit tests → integration tests → build Docker
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      ADMIN_PIN: '1234'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations
        working-directory: backend
        run: npx knex migrate:latest --knexfile src/infrastructure/db/knexfile.js

      - name: Run seed
        working-directory: backend
        run: npx knex seed:run --knexfile src/infrastructure/db/knexfile.js

      - name: Run integration tests
        working-directory: backend
        run: npm test

      - name: Run Sprint 2 acceptance tests
        working-directory: backend
        run: npm run test:sprint2

      - name: Run ESC/POS checksum test
        working-directory: backend
        run: npm run test:print

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t samba-pos-web-clone:ci .
        env:
          JWT_SECRET: ci-test-secret
          ADMIN_PIN: '1234'

      - name: Verify image was created
        run: docker images samba-pos-web-clone:ci
