# =====================================================================
# SambaPOS V3 Web Clone — CI/CD Pipeline
# =====================================================================
# Runs on every push to main and on every PR.
# Steps: install → migrate → seed → integration tests → KDS tests →
#        inventory tests → concurrency tests → Docker build
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-secret-do-not-use-in-production-32chars
      ADMIN_PIN: '1234'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations
        working-directory: backend
        run: npx knex migrate:latest --knexfile src/infrastructure/db/knexfile.js

      - name: Run seed
        working-directory: backend
        run: npx knex seed:run --knexfile src/infrastructure/db/knexfile.js

      - name: Integration tests (47)
        working-directory: backend
        run: node --test tests/api-integration.test.js

      - name: KDS verification tests (49)
        working-directory: backend
        run: |
          npx knex migrate:latest --knexfile src/infrastructure/db/knexfile.js
          npx knex seed:run --knexfile src/infrastructure/db/knexfile.js
          node --test tests/kds-verification.test.js

      - name: Inventory verification tests (13)
        working-directory: backend
        run: |
          npx knex migrate:latest --knexfile src/infrastructure/db/knexfile.js
          npx knex seed:run --knexfile src/infrastructure/db/knexfile.js
          node --test tests/inventory-verification.test.js

      - name: Concurrency tests (8)
        working-directory: backend
        run: |
          npx knex migrate:latest --knexfile src/infrastructure/db/knexfile.js
          npx knex seed:run --knexfile src/infrastructure/db/knexfile.js
          node --test tests/concurrency-verification.test.js

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t samba-pos-web-clone:ci .
        env:
          JWT_SECRET: ci-test-secret
          ADMIN_PIN: '1234'

      - name: Verify image was created
        run: docker images samba-pos-web-clone:ci
