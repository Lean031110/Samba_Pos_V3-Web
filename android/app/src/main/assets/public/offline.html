<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#044392">
  <title>SambaPos_LBA — Sin conexión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #044392 0%, #0a4fb0 35%, #1976d2 70%, #2196f3 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 48px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; font-weight: 600; }
    p { font-size: 16px; opacity: 0.85; max-width: 480px; line-height: 1.5; }
    .retry {
      margin-top: 32px;
      padding: 14px 32px;
      background: #ffffff;
      color: #044392;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      min-height: 56px;
      min-width: 200px;
      transition: transform 120ms ease, box-shadow 220ms ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.20);
    }
    .retry:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
    .retry:active { transform: translateY(0); }
    .hint { margin-top: 24px; font-size: 13px; opacity: 0.65; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Sin conexión</h1>
  <p>SambaPos_LBA no puede alcanzar el servidor. Verificá tu red y volvé a intentar. Las operaciones en curso se mantienen encoladas localmente y se sincronizarán automáticamente al recuperar la conexión.</p>
  <button class="retry" onclick="location.reload()">Reintentar</button>
  <div class="hint">SambaPos_LBA · v0.4.0</div>
</body>
</html>
